<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heavy Quark Energy Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; }
    h1   { font-size: 1.4rem; color: #222; }
    h2   { font-size: 1.1rem; color: #444; margin-top: 24px; }
    .grid      { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid-2    { display: grid; grid-template-columns: 1fr 1fr;     gap: 12px; }
    label      { display: flex; flex-direction: column; font-size: 0.85rem; color: #333; }
    input, select { margin-top: 4px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
    button     { margin-top: 24px; padding: 10px 28px; background: #1a73e8; color: white;
                 border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1558b0; }
    #results   { display: none; margin-top: 28px; }
    .cards     { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
    .card      { background: white; border: 1px solid #ddd; border-radius: 8px;
                 padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card span { display: block; font-size: 0.8rem; color: #666; margin-bottom: 6px; }
    .card b    { font-size: 1.3rem; color: #1a73e8; }
    #status    { margin-top: 12px; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>

<h1>⚛️ Heavy Quark Two-Body Energy Predictor</h1>
<p style="color:#666;font-size:0.9rem">Meng–Wang–Oka model · Surrogate Neural Network</p>

<h2>Quark Masses (GeV)</h2>
<div class="grid-2">
  <label>m₁ <input type="number" id="m1" value="1.5" min="0.1" max="6.0" step="0.1"></label>
  <label>m₂ <input type="number" id="m2" value="1.5" min="0.1" max="6.0" step="0.1"></label>
</div>

<h2>Model Parameters</h2>
<div class="grid">
  <label>α (alpha)   <input type="number" id="alpha"  value="0.8321" step="0.01"></label>
  <label>λ (Lambda)  <input type="number" id="lambda" value="0.1653" step="0.01"></label>
  <label>σ (spin)
    <select id="sigma">
      <option value="-3">-3 (spin-singlet)</option>
      <option value="1">1 (spin-triplet)</option>
    </select>
  </label>
  <label>κ (Kappa)   <input type="number" id="kappa"  value="0.5069" step="0.01"></label>
  <label>κ' (Kappa') <input type="number" id="kappa_" value="1.8609" step="0.01"></label>
  <label>A           <input type="number" id="A"      value="1.6553" step="0.01"></label>
  <label>B           <input type="number" id="B"      value="0.2204" step="0.01"></label>
</div>

<button onclick="predict()">Predict Energy Levels</button>
<div id="status">Loading model...</div>

<div id="results">
  <h2>Predicted Energy Levels (GeV)</h2>
  <div class="cards">
    <div class="card"><span>E₀</span><b id="E0">—</b></div>
    <div class="card"><span>E₁</span><b id="E1">—</b></div>
    <div class="card"><span>E₂</span><b id="E2">—</b></div>
    <div class="card"><span>E₃</span><b id="E3">—</b></div>
  </div>
</div>

<script>
  let model, norm;

  async function loadAssets() {
    [model, norm] = await Promise.all([
      tf.loadLayersModel('model/model.json'),
      fetch('norm.json').then(r => r.json())
    ]);
    document.getElementById('status').textContent = '✅ Model ready.';
  }

  async function predict() {
    if (!model) { alert('Model is still loading, please wait.'); return; }

    const inputs = [
      parseFloat(document.getElementById('alpha').value),
      parseFloat(document.getElementById('lambda').value),
      parseFloat(document.getElementById('sigma').value),
      parseFloat(document.getElementById('kappa').value),
      parseFloat(document.getElementById('kappa_').value),
      parseFloat(document.getElementById('A').value),
      parseFloat(document.getElementById('B').value),
      parseFloat(document.getElementById('m1').value),
      parseFloat(document.getElementById('m2').value),
    ];

    const xScaled = inputs.map((v, i) => (v - norm.x_mean[i]) / norm.x_std[i]);
    const tensor  = tf.tensor2d([xScaled]);
    const yScaled = model.predict(tensor);
    const yArr    = await yScaled.array();
    const result  = yArr[0].map((v, i) => v * norm.y_std[i] + norm.y_mean[i]);

    ['E0','E1','E2','E3'].forEach((id, i) => {
      document.getElementById(id).textContent = result[i].toFixed(4);
    });
    document.getElementById('results').style.display = 'block';
    tensor.dispose(); yScaled.dispose();
  }

  loadAssets();
</script>
</body>
</html>
