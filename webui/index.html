<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heavy Quark Energy Predictor</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<h1>⚛️ Heavy Quark Two-Body Energy Predictor</h1>
<p style="color:#666;font-size:0.9rem">Meng–Wang–Oka model · Surrogate Neural Network</p>

<h2>Quark Masses (GeV)</h2>
<div class="grid-2">
  <label>m₁ <input type="number" id="m1" value="1.5" min="0.1" max="6.0" step="0.1" /></label>
  <label>m₂ <input type="number" id="m2" value="1.5" min="0.1" max="6.0" step="0.1" /></label>
</div>

<h2>Model Parameters</h2>
<div class="grid">
  <label>α (alpha)   <input type="number" id="alpha"  value="0.8321" step="0.01" /></label>
  <label>λ (Lambda)  <input type="number" id="lambda" value="0.1653" step="0.01" /></label>
  <label>σ (spin)
    <select id="sigma">
      <option value="-3">-3 (spin-singlet)</option>
      <option value="1">1 (spin-triplet)</option>
    </select>
  </label>
  <label>κ (Kappa)   <input type="number" id="kappa"  value="0.5069" step="0.01" /></label>
  <label>κ' (Kappa') <input type="number" id="kappa_" value="1.8609" step="0.01" /></label>
  <label>A           <input type="number" id="A"      value="1.6553" step="0.01" /></label>
  <label>B           <input type="number" id="B"      value="0.2204" step="0.01" /></label>
</div>

<button onclick="predict()">Predict Energy Levels</button>
<div id="status">Loading model...</div>

<div id="results">
  <h2>Predicted Energy Levels (GeV)</h2>
  <div class="cards">
    <div class="card"><span>E₀</span><b id="E0">—</b></div>
    <div class="card"><span>E₁</span><b id="E1">—</b></div>
    <div class="card"><span>E₂</span><b id="E2">—</b></div>
    <div class="card"><span>E₃</span><b id="E3">—</b></div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
